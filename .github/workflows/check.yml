name: Check and deploy site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: python3 -m unittest discover -s tests -p '*_test.py'
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: public-site
          path: dist/
          include-hidden-files: true
          retention-days: 7
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://elhini.ru
    concurrency:
      group: hoster-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: public-site
          path: dist/
      - name: Deploy and verify HTTPS
        env:
          HOSTER_HOST: ${{ secrets.HOSTER_HOST }}
          HOSTER_USER: ${{ secrets.HOSTER_USER }}
          HOSTER_SSH_KEY: ${{ secrets.HOSTER_SSH_KEY }}
          HOSTER_KNOWN_HOSTS: ${{ secrets.HOSTER_KNOWN_HOSTS }}
        run: python3 scripts/deploy.py
